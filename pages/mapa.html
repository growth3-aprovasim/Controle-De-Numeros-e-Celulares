<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brabo Concursos - Mapa de Aparelhos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        /* Estilos específicos do Mapa visual */
        .mapa-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .mapa-coluna {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .mapa-col-titulo {
            text-align: center;
            font-weight: bold;
            color: var(--texto-claro);
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border: 1px solid var(--bordas);
            font-size: 16px;
        }
        .aparelho-card {
            position: relative;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            cursor: default;
        }
        /* As cores baseadas na sua imagem, adaptadas pro Dark Mode */
        .aparelho-disponivel { /* Amarelo */
            background-color: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fcd34d;
        }
        .aparelho-cheio { /* Cinza/Azulado */
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--bordas);
            color: var(--texto-claro);
        }
        .aparelho-restrito { /* Vermelho (Menos espaço) */
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        /* Botões flutuantes de edição (Aparecem ao passar o mouse) */
        .aparelho-acoes {
            position: absolute;
            top: -10px;
            right: -10px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: 0.2s ease;
        }
        .aparelho-card:hover .aparelho-acoes {
            opacity: 1;
        }
        .aparelho-acoes button {
            background-color: var(--bg-card);
            border: 1px solid var(--bordas);
            color: var(--texto-claro);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .aparelho-acoes button:hover { background-color: var(--laranja-brabo); color: white; border-color: var(--laranja-brabo); }
        .aparelho-acoes button.del:hover { background-color: #ef4444; border-color: #ef4444; }
        
        .slot-separator { opacity: 0.3; margin: 0 4px; }
        .slot-vazio { opacity: 0.4; }
    </style>
</head>
<body>

    <div id="menu-container" data-path="../"></div>
    <script src="../js/menu.js"></script>

    <main class="main-content">
        <div class="equipes-header" style="padding: 30px 40px 10px 40px;">
            <div class="header-esq">
                <h2>Posição Celulares Físicos</h2>
                <!-- Legenda do Dicionário -->
                <div style="display: flex; gap: 15px; margin-top: 10px;">
                    <span style="font-size: 12px; display: flex; align-items: center; gap: 6px;"><div style="width: 12px; height: 12px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 2px;"></div> Espaço para conexão</span>
                    <span style="font-size: 12px; display: flex; align-items: center; gap: 6px;"><div style="width: 12px; height: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--bordas); border-radius: 2px;"></div> Sem espaço para conexão</span>
                    <span style="font-size: 12px; display: flex; align-items: center; gap: 6px;"><div style="width: 12px; height: 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 2px;"></div> Menos espaços que o normal</span>
                </div>
            </div>
            <button class="btn-add" onclick="abrirModalMapa()">+ ADICIONAR APARELHO</button>
        </div>

        <section class="dashboard-area">
            <div class="mapa-grid-container">
                <!-- COLUNA ESQUERDA -->
                <div class="mapa-coluna" id="col-Esquerda">
                    <div class="mapa-col-titulo">Esquerda</div>
                    <!-- Preenchido via JS -->
                </div>
                
                <!-- COLUNA CENTRO -->
                <div class="mapa-coluna" id="col-Centro">
                    <div class="mapa-col-titulo">Centro</div>
                    <!-- Preenchido via JS -->
                </div>
                
                <!-- COLUNA DIREITA -->
                <div class="mapa-coluna" id="col-Direita">
                    <div class="mapa-col-titulo">Direita</div>
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Adicionar Aparelho -->
    <div id="modal-mapa" class="modal">
        <div class="modal-content" style="width: 450px;">
            <div class="modal-header">
                <h3 id="modal-titulo-mapa">Configurar Aparelho Físico</h3>
                <span class="close-btn" onclick="fecharModalMapa()">&times;</span>
            </div>
            <form id="form-mapa">
                <input type="hidden" id="edit-mapa-id">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Posição (Coluna)</label>
                        <select id="edit-mapa-coluna">
                            <option value="Esquerda">Esquerda</option>
                            <option value="Centro">Centro</option>
                            <option value="Direita">Direita</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ordem na Fila (Linha)</label>
                        <input type="number" id="edit-mapa-linha" min="1" placeholder="Ex: 1" required>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Capacidade Total (Padrão: 6)</label>
                        <input type="number" id="edit-mapa-max" min="1" max="10" value="6" required>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Números inseridos (separe por espaço ou vírgula)</label>
                        <input type="text" id="edit-mapa-chips" placeholder="Ex: 130 90 91 92">
                        <span style="font-size: 11px; color: var(--texto-muted); margin-top: 4px; display: block;">Os espaços vazios serão preenchidos com "x" automaticamente.</span>
                    </div>
                </div>

                <div class="modal-footer" style="margin-top: 25px;">
                    <button type="button" class="btn-cancelar" onclick="fecharModalMapa()">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Aparelho</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/env.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/script-mapa.js"></script>
</body>
</html>
