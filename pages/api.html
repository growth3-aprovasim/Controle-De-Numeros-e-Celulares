<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brabo Concursos - Números API</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div id="menu-container" data-path="../"></div>
    <script src="../js/menu.js"></script>

    <main class="main-content">
        <div class="equipes-header" style="padding: 30px 40px 10px 40px;">
            <div class="header-esq">
                <h2>Números API</h2>
                <div class="search-box">
                    <span class="material-icons-round">search</span>
                    <input type="text" id="input-filtro-api" placeholder="Buscar por número ou descrição..." oninput="filtrarApi()">
                </div>
            </div>
            <button class="btn-add" onclick="abrirModalApi()">+ ADICIONAR API</button>
        </div>

        <section class="dashboard-area">
            <div class="equipe-card aberto" style="padding: 0; border: 1px solid var(--bordas);">
                <div class="tabela-wrapper" style="display: block;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 30%; text-align: center;">NÚMERO</th>
                                <th style="text-align: left;">DESCRIÇÃO</th>
                                <th style="width: 120px; text-align: center;">AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-api-body">
                            <!-- Renderizado via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal de API -->
    <div id="modal-api" class="modal">
        <div class="modal-content" style="width: 450px;">
            <div class="modal-header">
                <h3 id="modal-titulo-api">Adicionar Número API</h3>
                <span class="close-btn" onclick="fecharModalApi()">&times;</span>
            </div>
            <form id="form-api">
                <input type="hidden" id="edit-api-id">
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Número</label>
                    <input type="text" id="edit-api-numero" placeholder="Ex: (99) 99999-9999" required>
                </div>
                
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="edit-api-desc" placeholder="Ex: IA ChatGPT" required>
                </div>

                <div class="modal-footer" style="margin-top: 25px;">
                    <button type="button" class="btn-cancelar" onclick="fecharModalApi()">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Vínculo</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/env.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/script-api.js"></script>
</body>
</html>
